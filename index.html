<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>2.5D自动战斗放置游戏</title>
<style>
*{box‑sizing:border‑box;margin:0;padding:0;font‑family:system‑ui,sans‑serif;}
body{background:#0e111a;color:#e2e6f0;padding:12px;max‑width:1200px;margin:0 auto;}
#gameCanvas{border:1px solid #30384d;background:#141822;}
.panel{background:#191e2d;border:1px solid #272e42;border‑radius:10px;padding:14px;margin‑bottom:12px;}
h2{font‑size:16px;margin‑bottom:8px;color:#fff;}
.info‑row{margin:4px 0;font‑size:13px;}
button{padding:8px 12px;border‑radius:7px;border:none;background:#5c77f0;color:#fff;margin:3px;cursor:pointer;}
button.danger{background:#c43838;}
</style>
</head>
<body>
<h1>🤖2.5D全自动战斗放置（AI自动寻怪、自动放技能、躲避攻击）</h1>

<div class="panel">
  <h2>游戏画面</h2>
  <canvas id="gameCanvas" width="860" height="480"></canvas>
</div>

<div class="panel">
  <h2>角色状态</h2>
  <div id="playerStatus" class="info‑row"></div>
</div>

<div class="panel">
  <h2>战斗日志</h2>
  <div id="fightLog" style="height:140px;overflow‑y:auto;font‑size:12px;color:#a4d8b4;"></div>
</div>

<div class="panel">
  <h2>操作</h2>
  <button onclick="savePlayerData()">保存进度</button>
  <button class="danger" onclick="resetPlayer()">重置存档</button>
</div>

<script>
let gameData = null;
let playerSave = null;
let canvas,ctx;
let gameRunning = false;
let animationId = null;

// 游戏世界实体
let playerEnt = null;
let monsterEntities = [];

// ==========读取编辑器导出game‑data.json==========
async function loadGameData(){
  try{
    const res = await fetch("./game‑data.json");
    if(!res.ok) throw new Error("missing");
    gameData = await res.json();
  }catch(e){
    document.body.innerHTML = `<div style="padding:40px;text‑align:center;color:#ff8686;"><h2>❌缺少 game‑data.json 游戏资源文件</h2><p>请确认打包完整，该文件来自编辑器导出数据</p></div>`;
    return;
  }
  canvas = document.getElementById("gameCanvas");
  ctx = canvas.getContext("2d");
  loadPlayerData();
  spawnMonsters();
  startGameLoop();
  renderUi();
}

// ==========玩家存档 localStorage ==========
function getDefaultPlayerSave(){
  const cfg = gameData.config;
  return {
    level: cfg.startLevel||1,
    hp: cfg.startHp||150,
    maxHp: cfg.startHp||150,
    mp:100,
    maxMp:100,
    gold: cfg.startGold||0,
    exp:0,
    posX:120,
    posY:240,
    skillCdMap:{},
    bag:[]
  }
}
function loadPlayerData(){
  const raw = localStorage.getItem("autoFightSave");
  if(!raw){
    playerSave = getDefaultPlayerSave();
    return;
  }
  try{
    playerSave = JSON.parse(raw);
  }catch{
    playerSave = getDefaultPlayerSave();
  }
}
function savePlayerData(){
  localStorage.setItem("autoFightSave",JSON.stringify(playerSave));
}
function resetPlayer(){
  if(!confirm("确定清空全部游戏进度？")) return;
  localStorage.removeItem("autoFightSave");
  playerSave = getDefaultPlayerSave();
  monsterEntities = [];
  spawnMonsters();
  renderUi();
}

// ==========工具函数（从编辑器数据按ID查找） ==========
function getMonsterById(id){ return gameData.monsters.find(m=>m.id === id); }
function getSkillById(id){ return gameData.skills.find(s=>s.id === id); }
function getItemById(id){ return gameData.items.find(it=>it.id === id); }

// ==========生成怪物实体 ==========
function spawnMonsters(){
  monsterEntities = [];
  const idList = gameData.config.battleMonsterIdList || [];
  let px = 450;
  for(let mid of idList){
    const mData = getMonsterById(mid);
    if(!mData) continue;
    monsterEntities.push({
      id:mid,
      name:mData.name,
      hp:mData.hp,
      maxHp:mData.hp,
      atk:mData.atk,
      def:mData.def||0,
      gold:mData.gold,
      exp:mData.exp,
      dropItemIds:mData.dropItemIds||[],
      x:px,
      y:120 + Math.random()*220,
      w:42,
      h:42,
      attackCd:0,
      dangerPos:null
    })
    px += 130;
  }
}

// ==========战斗日志输出 ==========
function addLog(text){
  const dom = document.getElementById("fightLog");
  dom.innerHTML += text + "<br/>";
  dom.scrollTop = dom.scrollHeight;
}

// ==========游戏主循环 2.5D模拟 ==========
function startGameLoop(){
  if(gameRunning) return;
  gameRunning = true;
  let lastTs = 0;
  function loop(ts){
    const dt = ts - lastTs;
    lastTs = ts;
    if(dt < 18){
      animationId = requestAnimationFrame(loop);
      return;
    }
    updateGame(dt);
    renderGame();
    renderUi();
    animationId = requestAnimationFrame(loop);
  }
  animationId = requestAnimationFrame(loop);
}

// ==========逻辑更新：AI自动行为 ==========
function updateGame(dt){
  if(!playerSave) return;
  const p = playerSave;

  // MP自然恢复
  p.mp = Math.min(p.maxMp, p.mp + dt*0.015);

  // CD递减
  Object.keys(p.skillCdMap).forEach(key=>{
    p.skillCdMap[key] = Math.max(0, p.skillCdMap[key] - dt);
  })

  // ---1.自动寻找最近怪物---
  let nearestMonster = null;
  let minDist = 99999;
  for(let m of monsterEntities){
    if(m.hp <= 0) continue;
    const dx = m.x - p.posX;
    const dy = m.y - p.posY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < minDist){
      minDist = dist;
      nearestMonster = m;
    }
  }

  // ---2 躲避怪物攻击预判（简单AI躲避逻辑）---
  for(let m of monsterEntities){
    if(m.hp <=0) continue;
    m.attackCd -= dt;
    if(m.attackCd <= 0){
      m.attackCd = 1800;
      m.dangerPos = {x:m.x,y:m.y};
      //玩家躲避：向侧边位移
      p.posY += (Math.random()>0.5 ? 45 : -45);
      p.posY = Math.max(40, Math.min(420,p.posY));
    }
  }

  // ---3 如果找到怪物，自动移动靠近，到达距离释放技能（技能全部来自编辑器skills数组）---
  if(nearestMonster){
    const target = nearestMonster;
    const attackRange = 130;
    const dx = target.x - p.posX;
    const dy = target.y - p.posY;
    const dist = Math.sqrt(dx*dx+dy*dy);

    if(dist > attackRange){
      //向怪物移动
      p.posX += dx * 0.022;
      p.posY += dy * 0.022;
    }else{
      //在攻击范围，遍历编辑器全部技能，CD好了、MP足够就自动释放
      for(let sk of gameData.skills){
        const cdLeft = p.skillCdMap[sk.id] || 0;
        if(cdLeft > 0) continue;
        if(p.mp < sk.mpCost) continue;

        //释放技能
        p.mp -= sk.mpCost;
        p.skillCdMap[sk.id] = sk.cd * 50;
        const dmg = Math.max(1, (p.level * 7) + sk.power - target.def);
        target.hp -= dmg;
        addLog(`【释放${sk.name}】对${target.name}造成 ${Math.round(dmg)} 伤害`);

        //怪物死亡结算
        if(target.hp <= 0){
          addLog(`✅ ${target.name}被击杀！获得金币${target.gold} EXP${target.exp}`);
          p.gold += target.gold;
          p.exp += target.exp;
          //掉落物品
          for(let dropId of target.dropItemIds){
            const it = getItemById(dropId);
            if(it) p.bag.push({...it});
          }
        }
      }
    }
  }

  //清理死亡怪物，重新刷新一波
  const aliveCount = monsterEntities.filter(m=>m.hp>0).length;
  if(aliveCount <=0){
    addLog("---所有怪物已清除，刷新怪物波次 ---");
    spawnMonsters();
  }

  savePlayerData();
}

// ==========2.5D斜角模拟画布渲染 ==========
function renderGame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  //地面网格
  ctx.fillStyle="#181d2b";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#232a3d";
  ctx.lineWidth=1;
  for(let x=0;x<canvas.width;x+=44){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();
  }
  for(let y=0;y<canvas.height;y+=44){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  }

  //绘制玩家
  ctx.fillStyle="#43aaff";
  ctx.fillRect(playerSave.posX, playerSave.posY,38,38);

  //绘制怪物
  for(let m of monsterEntities){
    if(m.hp <=0) continue;
    ctx.fillStyle="#dd4455";
    ctx.fillRect(m.x,m.y,m.w,m.h);
    //血条
    ctx.fillStyle="#222";
    ctx.fillRect(m.x,m.y‑8,m.w,5);
    const hpRate = m.hp / m.maxHp;
    ctx.fillStyle="#39d066";
    ctx.fillRect(m.x,m.y‑8,m.w*hpRate,5);
  }
}

//UI文字更新
function renderUi(){
  const p = playerSave;
  const cfg = gameData.config;
  document.getElementById("playerStatus").innerHTML = `
等级:${p.level}/${cfg.maxLevel||99} | HP:${Math.round(p.hp)}/${p.maxHp} | MP:${Math.round(p.mp)}/${p.maxMp}<br/>
金币:${Math.floor(p.gold)} | EXP:${Math.floor(p.exp)} | 背包物品数:${p.bag.length}
`;
}

window.onload = loadGameData;
</script>
</body>
</html>
